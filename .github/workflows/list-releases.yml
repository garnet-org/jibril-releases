name: List Releases and Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug_releases:
    name: List releases and corresponding tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: List all releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          list_releases="$(gh api \
            --paginate \
            --slurp \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"

          jq '
            [.[][] | {
              id,
              tag_name,
              name,
              draft,
              prerelease,
              immutable: (.immutable // false),
              target_commitish,
              author: .author.login,
              assets: [.assets[].name]
            }]
          ' <<<"$list_releases"
