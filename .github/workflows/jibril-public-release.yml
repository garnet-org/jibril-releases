name: Release Jibril

#
# Workflow
# --------
#
# A maintainer starts this workflow manually with one release label, for
# example v2.17.0-rc.5. Before the run starts, the repository must contain:
#
#   releases/<label>/release.json
#   releases/<label>/jibril-<label>-linux-x86_64.handoff.tar.gz.SHA256SUM
#   releases/index.json
#
# scripts/update-release-ledger.py writes all three from the handoff archive
# produced by the private build.
#
# The matching draft release must contain exactly:
#
#   jibril-<label>-linux-x86_64.handoff.tar.gz
#   jibril-<label>-linux-x86_64.handoff.tar.gz.SHA256SUM
#
# The handoff must contain exactly:
#
#   jibril
#   jibril-checksums.txt
#   release.json
#
# After every trust check passes, the workflow publishes a release
# exactly with this files:
#
#   jibril
#   jibril-<label>-linux-x86_64.tar.gz
#   SHA256SUMS
#
#
# Security verification
# ---------------------
#
# * The final SHA256SUMS covers all downloadable payloads.
#
# * The public TAR contains the three handoff payload files and one
#   keyless Sigstore/Cosign bundle for each payload file.
#
# * GitHub artifact attestations cover all six TAR members plus the
#   direct binary, final TAR, and final SHA256SUMS.
#
#
# Failure handling and re-runs
# ----------------------------
#
# The recovery model is deliberately blunt:
#
#   * Workflow never repairs a draft it finds in an unexpected shape.
#   * Every run must start from a draft the trusted private dispatcher created,
#     so the only supported recovery for a damaged draft is for a maintainer to
#     delete it and re-stage it. The run prints the exact commands when it
#     detects that state.
#
# What the workflow does do, so that reaching that state stays rare:
#
#   * Every idempotent GitHub read, download, and converging write is retried
#     with backoff.
#   * Draft mutations made by the finalization step are rolled back by a trap
#     on ERR, INT, and TERM, and again by a final always() cleanup step that
#     also covers cancellation and the job timeout, which no trap survives.
#   * The handoff asset is the only artifact here that cannot be rebuilt from
#     the reviewed commit, because only the private release workflow produces
#     it.
#   * A tag created by a run that then fails is deleted again. Otherwise a
#     corrected ledger commit is permanently blocked by the stale tag, since
#     an existing tag is only accepted when it names this exact commit.
#
#
# Run Mode
# --------
# The job resolves the release state before doing anything and picks a mode:
#
#   mode=publish  A draft staged by the private dispatcher exists. Promote it.
#   mode=verify   The label is already published. Published releases are
#                 immutable, so there is nothing left to change and nothing a
#                 maintainer could delete and redo either. The run re-verifies
#                 the public artifacts against the reviewed ledger and both
#                 attestation chains, then succeeds.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release label to publish, for example v2.17.0
        required: true
        type: string

# Jobs and third-party actions receive no implicit permissions.
permissions: {}

# Serialize every public release, including different release labels.
concurrency:
  group: public-jibril-release
  cancel-in-progress: false

jobs:
  public_release:
    name: Publish ${{ inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # Restricted environment with required maintainers.
    environment: release

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      INPUT_RELEASE: ${{ inputs.release }}

      EXPECTED_DRAFT_AUTHOR_ID: ${{ vars.PRIVATE_RELEASE_DISPATCHER_ID }}

      PUBLIC_PREDICATE_TYPE: https://github.com/garnet-org/jibril-releases/attestations/release/v1

      # These are verification expectations, not Cosign service settings. Do
      # not use the reserved COSIGN_OIDC_ISSUER name: Cosign v3 interprets it
      # as an explicit signing service URL and rejects its signing config.
      EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
      EXPECTED_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

    steps:
      - name: Validate the manual request and protected workflow identity
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # This step deliberately runs before the checkout, so we keep
          # minimal retry inline instead of cloning and sourcing from repo.
          gh_retry() {
            local attempt status
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              status=$?
              if (( attempt == 5 )); then return "$status"; fi
              sleep $(( attempt * 3 ))
            done
          }

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Unexpected public release workflow context." >&2
            exit 1
          fi

          expected_input_keys=release
          actual_input_keys="$(jq -r '.inputs | keys[]' \
            "$GITHUB_EVENT_PATH" | LC_ALL=C sort)"
          if [[ "$actual_input_keys" != "$expected_input_keys" ]]; then
            echo "The manual request must contain exactly the release input." >&2
            exit 1
          fi

          if [[ ! "$INPUT_RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer release label: $INPUT_RELEASE" >&2
            exit 1
          fi

          : "${EXPECTED_DRAFT_AUTHOR_ID:?Set PRIVATE_RELEASE_DISPATCHER_ID to the owner of the private release}"
          if [[ ! "$EXPECTED_DRAFT_AUTHOR_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "PRIVATE_RELEASE_DISPATCHER_ID must be a numeric GitHub user ID." >&2
            exit 1
          fi

          default_branch="$(gh_retry gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}" \
            --jq '.default_branch')"
          expected_ref="refs/heads/${default_branch}"
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/jibril-public-release.yml@${expected_ref}"
          # Ensure workflow runs from the default protected branch.
          if [[ "$GITHUB_REF" != "$expected_ref" ||
            "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ||
            ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The run must use the protected public workflow from the default branch." >&2
            exit 1
          fi

          default_head="$(gh_retry gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" \
            --jq '.sha')"
          compare_status="$(gh_retry gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${default_head}" \
            --jq '.status')"
          # Ensure the workflow commit is part of the default protected branch.
          if [[ "$compare_status" != "identical" &&
            "$compare_status" != "ahead" ]]; then
            echo "The workflow commit is no longer on the protected default-branch history." >&2
            exit 1
          fi

          # The handoff sidecar is always "$HANDOFF_NAME.SHA256SUM".
          handoff_name="jibril-${INPUT_RELEASE}-linux-x86_64.handoff.tar.gz"
          tar_name="jibril-${INPUT_RELEASE}-linux-x86_64.tar.gz"
          is_prerelease=false
          if [[ "$INPUT_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            is_prerelease=true
          fi

          {
            echo "label=$INPUT_RELEASE"
            echo "defaultBranch=$default_branch"
            echo "handoffName=$handoff_name"
            echo "tarName=$tar_name"
            echo "isPrerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
        #
        # Check out to validate the corresponding commit.
        #
      - name: Check out the exact public commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      #
      # Establish, once, that every helper this job runs is reviewed code
      #
      - name: Verify the release helpers are the reviewed, unmodified copies
        run: |
          set -euo pipefail

          # Every step below runs or sources something from this directory, so
          # let's ensure that scripts are committed and were not modified.
          #
          # This job does not writes below .github/. directory.
          scripts_dir=.github/scripts/release

          if [[ -L "$scripts_dir" || ! -d "$scripts_dir" ]]; then
            echo "$scripts_dir must be a real directory." >&2
            exit 1
          fi

          # Identical to the reviewed commit.
          if ! git diff --quiet -- "$scripts_dir"; then
            echo "Refusing to run: helpers under $scripts_dir differ from $GITHUB_SHA." >&2
            git --no-pager diff --stat -- "$scripts_dir" >&2
            exit 1
          fi

          # Nothing untracked, nothing missing, no stray subdirectories.
          tracked="$(git ls-files -- "$scripts_dir" | LC_ALL=C sort)"
          present="$(find "$scripts_dir" -mindepth 1 | LC_ALL=C sort)"
          if [[ -z "$tracked" || "$tracked" != "$present" ]]; then
            echo "Refusing to run: unexpected contents under $scripts_dir." >&2
            diff -u \
              <(printf '%s\n' "$tracked") \
              <(printf '%s\n' "$present") >&2 || true
            exit 1
          fi

          # Regular files only: a symlink would let a tracked, unmodified name
          # resolve to content from somewhere else entirely.
          while IFS= read -r helper; do
            if [[ -L "$helper" || ! -f "$helper" ]]; then
              echo "Refusing to run: $helper is not a regular file." >&2
              exit 1
            fi
          done <<<"$tracked"

          echo "Verified $(wc -l <<<"$tracked") release helpers against $GITHUB_SHA."
      #
      # Validate the release information
      #
      - name: Validate the draft release information
        id: ledger
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}

        run: |
          set -euo pipefail

          python3 -I -B .github/scripts/release/validate-release-ledger.py \
            --label "$LABEL" \
            --handoff-name "$HANDOFF_NAME" \
            --releases-dir releases \
            --github-output "$GITHUB_OUTPUT"

      #
      # Validate the draft and staging assets
      #
      - name: Validate the draft assets
        id: draft
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          # Check draft release
          if ! release_pages="$(gh api \
              --paginate \
              --slurp \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"; then
            echo "Failed to list releases in $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          draft_matches="$(jq -c --arg label "$LABEL" \
            '[.[][] | select(.draft == true and .tag_name == $label)]' \
            <<<"$release_pages")"
          draft_count="$(jq -r 'length' <<<"$draft_matches")"
          if [[ "$draft_count" -eq 0 ]]; then
            echo "No authenticated draft release has tag_name '$LABEL'." >&2
            exit 1
          fi
          if [[ "$draft_count" -ne 1 ]]; then
            echo "Expected one draft for '$LABEL', found $draft_count." >&2
            exit 1
          fi

          release_json="$(jq -c '.[0]' <<<"$draft_matches")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "The selected draft has an invalid release ID." >&2
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ||
            "$(jq -r '.tag_name' <<<"$release_json")" != "$LABEL" ]]; then
            echo "Release $LABEL is not the expected draft." >&2
            exit 1
          fi

          draft_author_id="$(jq -r '.author.id' <<<"$release_json")"
          if [[ "$draft_author_id" != "$EXPECTED_DRAFT_AUTHOR_ID" ]]; then
            echo "The draft was not created by the trusted private-release owner." >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' \
            "$HANDOFF_NAME" \
            SHA256SUMS | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' \
            <<<"$release_json" | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "The draft must contain exactly the handoff and staging SHA256SUMS." >&2
            diff -u \
              <(printf '%s\n' "$expected_assets") \
              <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          # If this is a pre-existing tag then accept it only
          # when it already references this exact reviewed ledger commit.
          # If the tag does not exist, then we create it later.
          tag_exists=false
          if gh api \
              --silent \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${LABEL}" \
              >/dev/null 2>&1; then
            tag_exists=true
            tag_commit="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/commits/${LABEL}" \
              --jq '.sha')"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Error: existing tag $LABEL does not point to the reviewed ledger commit." >&2
              exit 1
            fi
          fi

          # Output releaseId and tagExists
          {
            echo "releaseId=$release_id"
            echo "tagExists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

        #
        # Install Cosign
        #
      - name: Install the pinned Cosign toolchain
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6
        with:
          cosign-release: v3.0.6

        #
        # Download and authenticate draft assets
        #
      - name: Download and authenticate draft staging assets
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}
          EXPECTED_HANDOFF_SHA256: ${{ steps.ledger.outputs.handoffSha256 }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          for command_name in cosign jq readelf sha256sum tar; do
            command -v "$command_name" >/dev/null
          done

          rm -rf draft-inputs
          mkdir -m 0700 draft-inputs
          for asset_name in "$HANDOFF_NAME" SHA256SUMS; do
            gh release download "$LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir draft-inputs
          done

          test -s "draft-inputs/$HANDOFF_NAME"
          test -s draft-inputs/SHA256SUMS

          # assert draft sha256sums
          cmp --silent \
            draft-inputs/SHA256SUMS \
            "releases/$LABEL/SHA256SUMS-handoff"

          # assert content
          expected_line="${EXPECTED_HANDOFF_SHA256}  ${HANDOFF_NAME}"
          if [[ "$(wc -l < draft-inputs/SHA256SUMS)" -ne 1 ||
            "$(cat draft-inputs/SHA256SUMS)" != "$expected_line" ]]; then
            echo "The draft SHA256SUMS is not the committed canonical manifest." >&2
            exit 1
          fi
          (
            cd draft-inputs
            sha256sum --check --strict SHA256SUMS
          )

          # Assert the downloaded handoff checksum matches the
          # committed handoff checksum
          actual_handoff_sha256="$(sha256sum \
            "draft-inputs/$HANDOFF_NAME" | cut -d' ' -f1)"
          if [[ "$actual_handoff_sha256" != "$EXPECTED_HANDOFF_SHA256" ]]; then
            echo "The downloaded handoff does not match the committed digest." >&2
            exit 1
          fi

          # Take advantage of GitHub recorded server-side sha256
          # for each asset.
          release_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          for asset_name in "$HANDOFF_NAME" SHA256SUMS; do
            api_digest="$(jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest' \
              <<<"$release_json")"
            local_digest="sha256:$(sha256sum \
              "draft-inputs/$asset_name" | cut -d' ' -f1)"
            if [[ "$api_digest" != "$local_digest" ]]; then
              echo "GitHub's digest for $asset_name does not match the downloaded bytes." >&2
              exit 1
            fi
          done

        #
        # Extract the handoff archive inside release-inputs
        #
      - name: Safely extract the authenticated handoff
        env:
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}

        run: |
          set -euo pipefail

          rm -rf release-inputs
          mkdir -m 0700 release-inputs

          script_path="$GITHUB_WORKSPACE/.github/scripts/release/extract-jibril-handoff.py"
          if [[ ! -f "$script_path" || -L "$script_path" ]] ||
            ! git ls-files --error-unmatch -- "$script_path" >/dev/null 2>&1 ||
            ! git diff --quiet -- "$script_path"; then
            echo "The handoff extractor is missing, unsafe, or modified." >&2
            exit 1
          fi

          python3 -I -B "$script_path" \
            --archive "draft-inputs/$HANDOFF_NAME" \
            --destination release-inputs

        #
        # Match extracted handoff to the referenced ledger commit
        #
      - name: Match the extracted handoff to the committed ledger
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          EXPECTED_BINARY_SHA256: ${{ steps.ledger.outputs.binarySha256 }}
          EXPECTED_INNER_CHECKSUMS_SHA256: ${{ steps.ledger.outputs.innerChecksumsSha256 }}
          EXPECTED_RELEASE_JSON_SHA256: ${{ steps.ledger.outputs.releaseJsonSha256 }}

        run: |
          set -euo pipefail

          # Assert committed release with extracted version
          cmp --silent \
            release-inputs/release.json \
            "releases/$LABEL/release.json"

          actual_release_json_sha256="$(sha256sum \
            release-inputs/release.json | cut -d' ' -f1)"
          if [[ "$actual_release_json_sha256" != "$EXPECTED_RELEASE_JSON_SHA256" ]]; then
            echo "The embedded release.json digest does not match the ledger." >&2
            exit 1
          fi

          expected_inner_line="${EXPECTED_BINARY_SHA256}  jibril"
          if [[ "$(wc -l < release-inputs/jibril-checksums.txt)" -ne 1 ||
            "$(cat release-inputs/jibril-checksums.txt)" != "$expected_inner_line" ]]; then
            echo "jibril-checksums.txt is not the expected canonical manifest." >&2
            exit 1
          fi
          (
            cd release-inputs
            sha256sum --check --strict jibril-checksums.txt
          )

          # Assert checksums
          actual_binary_sha256="$(sha256sum \
            release-inputs/jibril | cut -d' ' -f1)"
          actual_inner_checksums_sha256="$(sha256sum \
            release-inputs/jibril-checksums.txt | cut -d' ' -f1)"
          if [[ "$actual_binary_sha256" != "$EXPECTED_BINARY_SHA256" ||
            "$actual_inner_checksums_sha256" != "$EXPECTED_INNER_CHECKSUMS_SHA256" ]]; then
            echo "The extracted subject digests do not match release.json." >&2
            exit 1
          fi

          if ! readelf -h release-inputs/jibril |
            grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'; then
            echo "The promoted Jibril binary is not Linux x86_64." >&2
            file release-inputs/jibril >&2
            exit 1
          fi

        #
        # Sign assets with keyless Cosign
        #
      - name: Sign every public payload file with keyless Cosign
        run: |
          set -euo pipefail

          rm -rf public-package
          mkdir -m 0700 public-package
          install -m 0755 release-inputs/jibril public-package/jibril
          install -m 0644 \
            release-inputs/jibril-checksums.txt \
            public-package/jibril-checksums.txt
          install -m 0644 \
            release-inputs/release.json \
            public-package/release.json

          cosign sign-blob --yes \
            --bundle public-package/jibril.sigstore.json \
            public-package/jibril

          cosign sign-blob --yes \
            --bundle public-package/jibril-checksums.txt.sigstore.json \
            public-package/jibril-checksums.txt

          cosign sign-blob --yes \
            --bundle public-package/release.json.sigstore.json \
            public-package/release.json

          for bundle in \
            public-package/jibril.sigstore.json \
            public-package/jibril-checksums.txt.sigstore.json \
            public-package/release.json.sigstore.json; do
            jq -e . "$bundle" >/dev/null
            chmod 0644 "$bundle"
          done

        #
        # Verify Cosign signatures
        #
      - name: Verify every public Cosign signature
        run: |
          set -euo pipefail

          verification_policy=(
            --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY"
            --certificate-oidc-issuer "$EXPECTED_CERTIFICATE_OIDC_ISSUER"
            --certificate-github-workflow-name "$GITHUB_WORKFLOW"
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-ref "$GITHUB_REF"
            --certificate-github-workflow-sha "$GITHUB_SHA"
            --certificate-github-workflow-trigger workflow_dispatch
          )

          cosign verify-blob \
            "${verification_policy[@]}" \
            --bundle public-package/jibril.sigstore.json \
            public-package/jibril

          cosign verify-blob \
            "${verification_policy[@]}" \
            --bundle public-package/jibril-checksums.txt.sigstore.json \
            public-package/jibril-checksums.txt

          cosign verify-blob \
            "${verification_policy[@]}" \
            --bundle public-package/release.json.sigstore.json \
            public-package/release.json

        #
        # Build the public archive
        #
      - name: Build the public archive and SHA256SUMS
        env:
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          TZ: UTC

        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir -m 0700 release-assets
          install -m 0755 release-inputs/jibril release-assets/jibril
          package_files=(
            jibril
            jibril-checksums.txt
            release.json
            jibril.sigstore.json
            jibril-checksums.txt.sigstore.json
            release.json.sigstore.json
          )

          touch -d '1980-01-01 00:00:00 UTC' \
            "${package_files[@]/#/public-package/}"

          build_tar() {
            local output_path="$1"
            tar \
              --sort=name \
              --format=gnu \
              --mtime='1980-01-01 00:00:00 UTC' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C public-package \
              -cf - \
              "${package_files[@]}" |
              gzip -n -9 > "$output_path"
          }

          build_tar "release-assets/$TAR_NAME"
          build_tar "$RUNNER_TEMP/$TAR_NAME.rebuilt"
          cmp --silent \
            "release-assets/$TAR_NAME" \
            "$RUNNER_TEMP/$TAR_NAME.rebuilt"

          (
            cd release-assets
            LC_ALL=C sha256sum jibril "$TAR_NAME" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

        #
        # Verify the archive
        #
      - name: Verify the complete public archive
        env:
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}

        run: |
          set -euo pipefail

          package_files=(
            jibril
            jibril-checksums.txt
            release.json
            jibril.sigstore.json
            jibril-checksums.txt.sigstore.json
            release.json.sigstore.json
          )
          expected_contents="$(printf '%s\n' \
            "${package_files[@]}" | LC_ALL=C sort)"
          actual_contents="$(tar -tzf \
            "release-assets/$TAR_NAME" | LC_ALL=C sort)"
          if [[ "$actual_contents" != "$expected_contents" ]]; then
            echo "The public TAR has unexpected contents." >&2
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/public-tar-verification"
          rm -rf "$verify_dir"
          mkdir -m 0700 "$verify_dir"
          tar \
            --extract \
            --gzip \
            --file "release-assets/$TAR_NAME" \
            --directory "$verify_dir" \
            --no-same-owner \
            --no-same-permissions

          for package_file in "${package_files[@]}"; do
            test -s "$verify_dir/$package_file"
            cmp --silent \
              "public-package/$package_file" \
              "$verify_dir/$package_file"
          done

          expected_final_manifest="$(printf '%s  jibril\n%s  %s' \
            "$(sha256sum release-assets/jibril | cut -d' ' -f1)" \
            "$(sha256sum "release-assets/$TAR_NAME" | cut -d' ' -f1)" \
            "$TAR_NAME")"
          if [[ "$(wc -l < release-assets/SHA256SUMS)" -ne 2 ||
            "$(cat release-assets/SHA256SUMS)" != "$expected_final_manifest" ]]; then
            echo "The final SHA256SUMS is not canonical." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          cmp --silent "$verify_dir/jibril" release-assets/jibril

        #
        # Assert the tag binds to the ledger commit
        #
      - name: Bind the release tag to the reviewed ledger commit
        id: tag
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          TAG_EXISTS: ${{ steps.draft.outputs.tagExists }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          release_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ||
            "$(jq -r '.immutable // false' <<<"$release_json")" != "false" ||
            "$(jq -r '.tag_name' <<<"$release_json")" != "$LABEL" ]]; then
            echo "The draft changed before tag binding." >&2
            exit 1
          fi

          if [[ "$TAG_EXISTS" != "true" ]]; then
            gh api \
              --method POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${LABEL}" \
              -f "sha=${GITHUB_SHA}" \
              >/dev/null
          fi

          tag_commit="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${LABEL}" \
            --jq '.sha')"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $LABEL is not bound to the reviewed ledger commit." >&2
            exit 1
          fi

          gh api \
            --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f "target_commitish=${GITHUB_SHA}" \
            >/dev/null

          echo "tagCommitSha=$tag_commit" >> "$GITHUB_OUTPUT"

        #
        # Build the GitHub attestation predicate
        #
      - name: Build the public GitHub attestation predicate
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          TAG_COMMIT_SHA: ${{ steps.tag.outputs.tagCommitSha }}
          HANDOFF_SHA256: ${{ steps.ledger.outputs.handoffSha256 }}
          RELEASE_JSON_SHA256: ${{ steps.ledger.outputs.releaseJsonSha256 }}
          BINARY_SHA256: ${{ steps.ledger.outputs.binarySha256 }}
          INNER_CHECKSUMS_SHA256: ${{ steps.ledger.outputs.innerChecksumsSha256 }}

        run: |
          set -euo pipefail

          jq -n \
            --arg release "$LABEL" \
            --arg handoff_name "$HANDOFF_NAME" \
            --arg handoff_sha256 "$HANDOFF_SHA256" \
            --arg archive_name "$TAR_NAME" \
            --arg release_json_sha256 "$RELEASE_JSON_SHA256" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --arg inner_checksums_sha256 "$INNER_CHECKSUMS_SHA256" \
            --arg public_repository "$GITHUB_REPOSITORY" \
            --arg public_tag_commit "$TAG_COMMIT_SHA" \
            --arg public_workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg public_workflow_sha "$GITHUB_SHA" \
            '{
              schemaVersion: 1,
              release: {
                tag: $release,
                platforms: ["linux-x86_64"],
                archive: $archive_name
              },
              reviewedInput: {
                handoff: {
                  name: $handoff_name,
                  sha256: $handoff_sha256
                },
                releaseJsonSha256: $release_json_sha256,
                binarySha256: $binary_sha256,
                innerChecksumsSha256: $inner_checksums_sha256
              },
              publisher: {
                repository: $public_repository,
                ledgerCommit: $public_tag_commit,
                workflowRef: $public_workflow_ref,
                workflowCommit: $public_workflow_sha
              }
            }' > "$RUNNER_TEMP/jibril-public-release-predicate.json"

          jq -e . "$RUNNER_TEMP/jibril-public-release-predicate.json" >/dev/null

        #
        # Generate GitHub attestations
        #
      - name: Generate GitHub attestations for payloads and final assets
        id: public_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/jibril
            public-package/jibril-checksums.txt
            public-package/release.json
            public-package/jibril.sigstore.json
            public-package/jibril-checksums.txt.sigstore.json
            public-package/release.json.sigstore.json
            release-assets/${{ steps.release_info.outputs.tarName }}
            release-assets/SHA256SUMS
          predicate-type: ${{ env.PUBLIC_PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/jibril-public-release-predicate.json

        #
        # Verify the GitHub attestations
        #
      - name: Verify the generated GitHub attestations
        env:
          ATTESTATION_BUNDLE: ${{ steps.public_attestation.outputs.bundle-path }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -s "$ATTESTATION_BUNDLE"
          jq -e . "$ATTESTATION_BUNDLE" >/dev/null
          subjects=(
            release-assets/jibril
            public-package/jibril-checksums.txt
            public-package/release.json
            public-package/jibril.sigstore.json
            public-package/jibril-checksums.txt.sigstore.json
            public-package/release.json.sigstore.json
            "release-assets/$TAR_NAME"
            release-assets/SHA256SUMS
          )
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$PUBLIC_PREDICATE_TYPE" \
              --bundle "$ATTESTATION_BUNDLE"
          done

        #
        # Update the assets with the final ones.
        #
      - name: Replace the staging assets with the final ones
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          HANDOFF_NAME: ${{ steps.release_info.outputs.handoffName }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          # Load rollback only from the commit
          rollback_script="$GITHUB_WORKSPACE/.github/scripts/release/rollback-staging-assets.sh"
          if [[ ! -f "$rollback_script" || -L "$rollback_script" ]] ||
            ! git ls-files --error-unmatch -- "$rollback_script" >/dev/null 2>&1 ||
            ! git diff --quiet -- "$rollback_script"; then
            echo "The rollback helper is missing, unsafe, or modified: $rollback_script" >&2
            exit 1
          fi

          bash -n "$rollback_script"

          # Preserve the original finalization failure, check whether the
          # external rollback succeeded, and never resume partial publication.
          handle_finalization_error() {
            local original_status=$?
            local rollback_status

            # A rollback error must not recursively invoke this ERR handler.
            trap - ERR

            if bash "$rollback_script"; then
              echo "The original staging draft was restored." >&2
            else
              rollback_status=$?
              echo "The staging rollback failed with status $rollback_status." >&2
            fi

            # Reset errors, capture and return original error
            # if any.
            set -e
            exit "$original_status"
          }

          expected_staging_assets="$(printf '%s\n' \
            "$HANDOFF_NAME" SHA256SUMS | LC_ALL=C sort)"
          release_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          actual_assets="$(jq -r '.assets[].name' \
            <<<"$release_json" | LC_ALL=C sort)"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ||
            "$(jq -r '.immutable // false' <<<"$release_json")" != "false" ||
            "$(jq -r '.tag_name' <<<"$release_json")" != "$LABEL" ||
            "$actual_assets" != "$expected_staging_assets" ]]; then
            echo "Release ID $RELEASE_ID is not the expected staging draft for $LABEL." >&2
            exit 1
          fi

          # Register the trap now
          trap handle_finalization_error ERR

          # Upload the archive and direct binary first,
          # then replace SHA256SUMS and remove the handoff last.
          gh release upload "$LABEL" \
            "release-assets/$TAR_NAME" \
            release-assets/jibril \
            --repo "$GITHUB_REPOSITORY"

          verify_dir="$RUNNER_TEMP/remote-final-assets"
          rm -rf "$verify_dir"
          mkdir -m 0700 "$verify_dir"
          for asset_name in jibril "$TAR_NAME"; do
            gh release download "$LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$verify_dir"
            # Perform an extra verification
            cmp --silent \
              "release-assets/$asset_name" \
              "$verify_dir/$asset_name"
          done

          # Replace the SHA256SUMS with the final release one.
          gh release delete-asset "$LABEL" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --yes
          gh release upload "$LABEL" \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"

          gh release download "$LABEL" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --dir "$verify_dir"
          cmp --silent \
            release-assets/SHA256SUMS \
            "$verify_dir/SHA256SUMS"

          gh release delete-asset "$LABEL" "$HANDOFF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --yes

          expected_final_assets="$(printf '%s\n' \
            jibril "$TAR_NAME" SHA256SUMS | LC_ALL=C sort)"
          final_release_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          final_assets="$(jq -r '.assets[].name' \
            <<<"$final_release_json" | LC_ALL=C sort)"
          if [[ "$(jq -r '.draft' <<<"$final_release_json")" != "true" ||
            "$(jq -r '.immutable // false' <<<"$final_release_json")" != "false" ||
            "$(jq -r '.tag_name' <<<"$final_release_json")" != "$LABEL" ||
            "$final_assets" != "$expected_final_assets" ]]; then
            echo "Release ID $RELEASE_ID is not the expected three-asset final draft." >&2
            exit 1
          fi

          trap - ERR

        #
        # Revalidate the remote draft assets before final push
        #
      - name: Revalidate the remote draft immediately before publication
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          TAG_COMMIT_SHA: ${{ steps.tag.outputs.tagCommitSha }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          release_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          expected_assets="$(printf '%s\n' \
            jibril "$TAR_NAME" SHA256SUMS | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' \
            <<<"$release_json" | LC_ALL=C sort)"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ||
            "$(jq -r '.immutable // false' <<<"$release_json")" != "false" ||
            "$actual_assets" != "$expected_assets" ]]; then
            echo "The release is not in the expected final draft state." >&2
            exit 1
          fi

          # Get the tag commit
          tag_commit="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${LABEL}" \
            --jq '.sha')"
          if [[ "$tag_commit" != "$TAG_COMMIT_SHA" ||
            "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "The release tag changed before publication." >&2
            exit 1
          fi

          # Verify assets match
          verify_dir="$RUNNER_TEMP/prepublish-assets"
          rm -rf "$verify_dir"
          mkdir -m 0700 "$verify_dir"
          for asset_name in jibril "$TAR_NAME" SHA256SUMS; do
            gh release download "$LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$verify_dir"
            cmp --silent \
              "release-assets/$asset_name" \
              "$verify_dir/$asset_name"
          done
          (
            cd "$verify_dir"
            sha256sum --check --strict SHA256SUMS
          )

        #
        # Publish
        #
      - name: Publish the release
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          RELEASE_ID: ${{ steps.draft.outputs.releaseId }}
          IS_PRERELEASE: ${{ steps.release_info.outputs.isPrerelease }}
          TAG_COMMIT_SHA: ${{ steps.tag.outputs.tagCommitSha }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          release_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_notes=$'Public Jibril release for Linux x86_64.\n\n'
          release_notes+=$'Date: '"${release_date}"$'\n'
          release_notes+=$'Public ledger and tag commit: '"${TAG_COMMIT_SHA}"$'\n'
          release_notes+=$'Public signing workflow: '"${GITHUB_WORKFLOW_REF}"$'\n'
          release_notes+=$'Public signing workflow commit: '"${GITHUB_SHA}"$'\n'
          release_notes+=$'Cosign identity: '"${EXPECTED_CERTIFICATE_IDENTITY}"$'\n'
          release_notes+=$'Cosign issuer: '"${EXPECTED_CERTIFICATE_OIDC_ISSUER}"$'\n'
          release_notes+=$'GitHub attestation predicate: '"${PUBLIC_PREDICATE_TYPE}"$'\n'

          # Check if it is a prerelease
          make_latest=true
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            make_latest=false
          fi

          gh api --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f "name=$LABEL" \
            -f "body=$release_notes" \
            -F draft=false \
            -F "prerelease=$IS_PRERELEASE" \
            -f "make_latest=$make_latest" \
            >/dev/null

        #
        # Confirm immutable release including integrity and attestations
        #
      - name: Confirm Immutable release and its integrity
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          IS_PRERELEASE: ${{ steps.release_info.outputs.isPrerelease }}
          TAG_COMMIT_SHA: ${{ steps.tag.outputs.tagCommitSha }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          # Assert immutable release
          immutable=false
          for attempt in {1..15}; do
            release_json="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${LABEL}")"
            immutable="$(jq -r '.immutable // false' <<<"$release_json")"
            [[ "$immutable" == "true" ]] && break
            [[ "$attempt" -lt 15 ]] && sleep 5
          done

          if [[ "$immutable" != "true" ||
            "$(jq -r '.draft' <<<"$release_json")" != "false" ||
            "$(jq -r '.prerelease' <<<"$release_json")" != "$IS_PRERELEASE" ]]; then
            echo "The published release did not reach the expected immutable state." >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' \
            jibril "$TAR_NAME" SHA256SUMS | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' \
            <<<"$release_json" | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "The immutable release has an unexpected asset set." >&2
            exit 1
          fi

          # Assert the immutable tag reference the ledger commit.
          tag_commit="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${LABEL}" \
            --jq '.sha')"
          if [[ "$tag_commit" != "$TAG_COMMIT_SHA" ||
            "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "The immutable tag does not name the reviewed ledger commit." >&2
            exit 1
          fi

          # Assert assets against GitHub automatic immutable
          # release attestation.
          verified=false
          for attempt in {1..30}; do
            assets_verified=true
            if ! gh release verify "$LABEL" --repo "$GITHUB_REPOSITORY"; then
              assets_verified=false
            else
              for asset_name in jibril "$TAR_NAME" SHA256SUMS; do
                if ! gh release verify-asset "$LABEL" \
                  "release-assets/$asset_name" \
                  --repo "$GITHUB_REPOSITORY"; then
                  assets_verified=false
                  break
                fi
              done
            fi

            if [[ "$assets_verified" == "true" ]]; then
              verified=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Immutable release attestation is not ready; retrying ($attempt/30)."
              sleep 10
            fi
          done
          if [[ "$verified" != "true" ]]; then
            echo "The immutable release or one of its assets could not be verified." >&2
            exit 1
          fi

          # Assert that every release asset is attested
          # by the workflow
          for subject in \
            release-assets/jibril \
            "release-assets/$TAR_NAME" \
            release-assets/SHA256SUMS; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$PUBLIC_PREDICATE_TYPE"
          done

        #
        # Write Release summary
        #
      - name: Write the release summary
        env:
          LABEL: ${{ steps.release_info.outputs.label }}
          TAR_NAME: ${{ steps.release_info.outputs.tarName }}
          ATTESTATION_URL: ${{ steps.public_attestation.outputs.attestation-url }}

        run: |
          set -euo pipefail

          {
            echo "## Published immutable public Jibril $LABEL release"
            echo
            echo "- Release: $LABEL"
            echo "- Platform: linux-x86_64"
            echo "- Direct binary: jibril"
            echo "- Archive: $TAR_NAME"
            echo "- Final checksum manifest: SHA256SUMS"
            echo "- Ledger checksum manifest: releases/$LABEL/SHA256SUMS-handoff"
            echo "- Public signing workflow: $GITHUB_WORKFLOW_REF"
            echo "- Cosign identity: $EXPECTED_CERTIFICATE_IDENTITY"
            echo "- GitHub attestation: $ATTESTATION_URL"
            echo "- Immutable release verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"
